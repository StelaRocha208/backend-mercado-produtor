spring.application.name=backend-mercado-produtor

spring.config.import=optional:file:.env[.properties]

# Configura��es de Conex�o com o Supabase
spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.table=flyway_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Cria��o Autom�tica das Tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

api.security.token.secret=${JWT_SECRET:my-secret-key}

# Configura��es do Servidor de E-mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=larissam.g2060@gmail.com
spring.mail.password=senha
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



app.frontend.url=http://localhost:3000